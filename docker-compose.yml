version: '3.8'

services:
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: lactokeeper
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    working_dir: /app
    volumes:
      - ./src/backend:/app
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://mongo:27017/lactokeeper
    depends_on:
      - mongo
    restart: unless-stopped

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    working_dir: /app
    volumes:
      - ./src/frontend:/app
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  mongo_data:
