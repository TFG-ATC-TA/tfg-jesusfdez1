version: '3.8'

services:
  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    working_dir: /app
    volumes:
      - ./src/backend:/app
    environment:
      - NODE_ENV=production
    restart: unless-stopped

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    working_dir: /app
    volumes:
      - ./src/frontend:/app
    environment:
      - NODE_ENV=production
    depends_on:
      - backend
    restart: unless-stopped
